<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Magical Politician</title>
  <style>
    /* 폰트 설정 */
    @font-face {
        font-family: 'Pretendard';
        src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-ExtraLight.woff2') format('woff2');
        font-weight: 500;
        font-display: swap;}
    @font-face {
    font-family: 'ElegantSerif';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2604-1@1.0/GraceSerif-Regular.woff2') format('woff2');
    font-weight: 500;
    font-display: swap;}
    
    * { margin:0; padding:0; font-family:Pretendard; }

    /* 기본 바디, 커서 설정 */
    body {
        margin: 0;
        background-image: url('back.png');
        background-repeat: no-repeat;
        background-attachment: fixed;
        background-size: cover;
        background-position: center;
        cursor: url('magic_wand.png'), auto; /* 마법봉 커서 */}

    a, button { cursor: url('magic_wand.png'), pointer; }

    /* 나브 바 */
    nav {display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 40px;
        background: rgba(255,45,170,1);
        color: white;
        line-height: 1.0;
        position: fixed; /* 상단 고정 */
        width: 100%;
        box-sizing: border-box;
        z-index: 9999;
        white-space: nowrap;}

    nav a {
        margin-left: 20px;
        color: white;
        text-decoration: none;
        font-weight: 1000;
        font-size: 20px;}

    .logo1 {
        font-family: "Mea Culpa", cursive;
        font-weight: 400;
        font-style: normal;
        font-size: 15px;}

    .logo2 {
        font-family: "Mea Culpa", cursive;
        font-weight: 600;
        display: block;
        font-style: normal;
        font-size: 20px;
        margin-bottom: 0;}

    /* 구름 설정 */
    .cloud-scene {
        padding-top:50px;
        position: relative;
        width: 100%;
        height: 120vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 10;}

    .cloud {
        position: absolute;
        width: 80%;
        z-index: 20;
        transition: transform 1.7s ease-out; /* 부드럽게 밀려나기 */}

    /* 스크롤 시 발동 */
    .cloud-scene.active .cloud.left { transform: translateX(-120%); }
    .cloud-scene.active .cloud.right { transform: translateX(120%); }
    .cloud-scene.active .magic-title { 
        opacity: 1; 
        transform: scale(1); /* 커지면서 선명하게 등장 */}

    .cloud.left { left: -5%; }
    .cloud.right { right: -5%; }

    /* 중앙 타이틀 */
    .main-title {
        z-index: 15;
        text-align: left; white-space: nowrap;}

 

    .magic-title {
    font-family: "Mea Culpa", cursive;
    font-size: 90px;
    line-height: 1.2;
    text-align: center; 
    text-shadow: -3px -3px 2px white;
    
    /* 1. 글자 색상과 광택 배경 설정 */
    background: linear-gradient(120deg, #ff379b 40%, #fff 50%, #ff69b4 70%);
    background-size: 200% auto; /* 배경을 크게 늘려야 빛이 지나갈 공간이 생겨요 */
    
    /* 2. 배경을 글자 모양으로 자르기 */
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    
    /* 3. 광채 효과 */
    filter: drop-shadow(0 0 15px rgba(255, 105, 180, 0.8));

    /* 4. 애니메이션 연결 (3초마다 빛이 지나감) */
    animation: shine 5s linear infinite;
    
    /* 구름 걷힐 때 나타나는 설정 유지 */
    opacity: 0;
    transform: scale(0.5);
    transition: all 1.0s ease-in-out;}

/* 빛이 지나가는 움직임 정의 */
@keyframes shine {
    0% { background-position: -200% center; }
    100% { background-position: 200% center; }}

/* 구름이 걷혔을 때(active) 타이틀이 보이게 하는 설정 */
.cloud-scene.active .magic-title {
    opacity: 1;
    transform: scale(1);}

    .hidden_main{
        width: 100%;
        z-index: 15;
        position: center; margin-top: 250px; }

    section {hight:200px; margin:auto; width: 1000px} /* 스크롤 공간용 */

    h1{margin-top:-200px; letter-spacing: -1px;}

    .share_sound_menu{width: 10%; position: absolute;
    top: 70px;    /* 위에서 50px 내려옴 */
    right: 30px;  /* 오른쪽에서 30px 들어옴 */
    cursor: pointer;
    transition: transform 0.3s; /* 마우스 올렸을 때 효과용 */}

    .share_sound_menu:hover {
    transform: scale(1.1); /* 살짝 커지는 효과 */}


    /* 운명의 마법정치인을 골라보세요 */
    .select {
        text-align: center;
        font-family: ElegantSerif;
        font-size: 50px;
        line-height: 1.2;
        text-align: center;
        font-weight: 700;
        color: #ff379b;
        background-color: white;
        padding: 20px;
        margin-top:100px;}

    /* 1. 바구니 설정: 자식들을 가로로 나열함 */
.card-container {
    display: flex;            /* 가로 정렬 활성화 */
    justify-content: center;   /* 가운데로 모으기 */
    gap: 30px;                /* 카드 사이 간격 */
    padding: 100px 0;          /* 위아래 여백 */
    padding-bottom: 300px;
    perspective: 1000px;      /* 회전 효과를 위한 입체감 추가 */
}

/* 2. 카드 설정 */
.magic-card {
    width: 250px; 
    aspect-ratio: 1.4 / 3; 
    border-radius: 10px;
    overflow: hidden;
    background: #fff;
    transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    opacity: 90%;
    cursor: pointer;
    border: 3px solid #ffffff;}

/* 3. 이미지 설정: 카드 안에 꽉 차게 */
.magic-card img {
    width: 100%;
    height: 100%;
    object-fit: contain; 
    background-color: #fff;}

/* 4. 마우스 올렸을 때 (Hover) */
.magic-card:hover {
    transform: scale(1.02) rotateY(13deg); /* 커지면서 살짝 회전 */
    box-shadow: 0 0 30px rgba(255, 55, 155, 0.7); /* 핑크빛 광채 */
    z-index: 10;}


.select{line-height: 1.5}
.earth{position: absolute; padding-top:50px;}



  </style>
</head>




<body>

    <nav>
        <div class="logo1">WORLD STAGE:<div class="logo2">MAGICAL POLITICIAN</div></div>
        <div class="menu">
      <a href="#">캐릭터 소개</a>
      <a href="#">세계관</a>
      <a href="#">시스템 안내</a>
      <a href="#">NEWS</a>
    </div>
    </nav>

    <div class="cloud-scene">
    <img src="cloud_left.png" class="cloud left" alt="왼쪽구름">
    <img src="cloud_right.png" class="cloud right" alt="오른쪽구름">

    <section>
      <div class="main-title">
        <h1 class="magic-title"><img src=hidden_main.png class="hidden_main"></h1>
        <h1 class="magic-title">WORLD STAGE:<br>MAGICAL POLITICIAN</h1>
        <img src="share_sound_menu.png" class="share_sound_menu">
      </div>
    </section>
    </div>
    
    <section>
        <div class="select">운명의 마법정치인을 골라보세요!</div>
    </section>
    <section class="card-section">
    <div class="card-container">
        <div class="magic-card"><img src="hitler_card.png" alt="카드1"></div>
        <div class="magic-card"><img src="trump_card.png" alt="카드2"></div>
        <div class="magic-card"><img src="mao_card.png" alt="카드3"></div>
    </div>
    </section>
    <section>
        <div class="select">나만의 마법정치인과 함께<br>세계를 정복해 볼까요?</div>
        <div class="earth"><img src="earth.png"></div>
    </section>





  <script>
    // 1. 파티클 효과 (커서 따라다니기)
    document.addEventListener('mousemove', function(e) {
        const particle = document.createElement('span');
        const items = ['✨', '⭐', '💖', '🌸'];
        particle.innerText = items[Math.floor(Math.random() * items.length)];
        
        particle.style.position = 'fixed';
        particle.style.left = e.clientX + 'px';
        particle.style.top = e.clientY + 'px';
        particle.style.pointerEvents = 'none';
        particle.style.zIndex = '9999';
        particle.style.fontSize = '24px';
        particle.style.transition = 'all 1s ease-out';
        
        document.body.appendChild(particle);

        setTimeout(() => {
            particle.style.transform = `translate(${(Math.random()-0.5)*150}px, ${(Math.random()-0.5)*150}px) rotate(360deg)`;
            particle.style.opacity = '0';
        }, 50);

        setTimeout(() => { particle.remove(); }, 1000);
    });

    // 2. 구름 스크롤 감지
    window.addEventListener('scroll', function() {
        const scene = document.querySelector('.cloud-scene');
        // 스크롤이 조금만 내려가도 구름이 걷힘
        if (window.scrollY > 30) {
            scene.classList.add('active');
        } else {
            scene.classList.remove('active');
        }
    });
  </script>

</body>
</html>
